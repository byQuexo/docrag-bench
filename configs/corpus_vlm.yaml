# Chatbot mode: same index and retrieval as baseline_vlm, but every question searches
# every indexed document (scope: corpus). Retrieval only: no LLM, no cost.
name: corpus_vlm
embedder: onnx:gte-small
prefix_headings: true
ocr: vlm                 # vision LLM transcribes text + describes charts
ocr_model: "openrouter:anthropic/claude-haiku-5.5"
retrieval: hybrid_rerank
scope: corpus            # search ALL indexed documents (chatbot mode), not just the question's
top_k: 10
prefetch_k: 50
rrf_k: 60
reranker: onnx:gte-reranker-modernbert-base
rerank_threshold: 0.6318    # calibrated per question on dev, with VLM OCR
context_k: 5
llm: null                # e.g. "ollama:qwen3:8b" or "gemini:gemini-3.8-flash"
judge: null
dataset:
  split: test
  max_docs: null        # all test documents
