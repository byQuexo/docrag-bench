# CI for docrag-bench: lint + types + unit tests, an E2E test against a real
# Qdrant, and a Docker build check.
#
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel an outdated run when the same branch is pushed again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true # caches downloaded wheels between runs

      # --locked: CI tests exactly the committed dependency versions.
      - run: uv sync --locked --extra cpu # CPU onnxruntime: no CUDA wheels in CI

      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy src
      # E2E tests run in their own job, which has a Qdrant service.
      - name: Unit tests
        run: uv run pytest -m "not e2e" -q
      # Execute the lesson SOLUTION notebooks so they can't rot when the code
      # changes. The exercise notebooks are incomplete on purpose and not run.
      - name: Lesson notebooks
        run: uv run pytest --nbmake notebooks/lessons/solutions -q

  e2e:
    runs-on: ubuntu-latest
    # Same Qdrant image tag as compose.yaml.
    services:
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports:
          - 6333:6333
    env:
      DOCRAG_E2E_QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra cpu # CPU onnxruntime: no CUDA wheels in CI
      # Wait for Qdrant's readiness endpoint instead of a fixed sleep.
      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6333/readyz && exit 0
            sleep 2
          done
          echo "Qdrant did not become ready" && exit 1
      - name: E2E tests
        run: uv run pytest -m e2e -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build only (no push): catches a broken Dockerfile in the PR.
      - name: Build image
        run: docker build -t docrag-bench:ci .
