# CI for docrag-bench: lint + types, unit and integration tests with coverage,
# and a Docker build check.
#
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel an outdated run when the same branch is pushed again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: no job needs to write to the repository.
permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0 # exact: setup-uv publishes no moving major tag
        with:
          enable-cache: true # caches downloaded wheels between runs

      # --locked: CI tests exactly the committed dependency versions.
      - run: uv sync --locked --extra cpu # CPU onnxruntime: no CUDA wheels in CI

      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types (mypy --strict)
        run: uv run mypy src tests scripts
      # Unit tests AND the integration tests (marker e2e): those start a real
      # Qdrant via testcontainers on the runner's Docker. One run, so coverage
      # counts both. Fails below [tool.coverage.report] fail_under.
      - name: Tests with coverage
        run: uv run pytest -q --cov --cov-report=xml --cov-report=term
      - name: Coverage summary
        if: always()
        run: |
          echo "## Coverage (unit + integration, lines and branches)" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
      # Execute the lesson SOLUTION notebooks so they can't rot when the code
      # changes. The exercise notebooks are incomplete on purpose and not run.
      - name: Lesson notebooks
        run: uv run pytest --nbmake notebooks/lessons/solutions -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Build only (no push): catches a broken Dockerfile in the PR.
      - name: Build image
        run: docker build -t docrag-bench:ci .
