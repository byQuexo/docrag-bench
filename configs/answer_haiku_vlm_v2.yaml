# One YAML = one row in the results table. See src/docrag/shared/config.py.
name: answer_haiku_vlm_v2
embedder: onnx:gte-small
prefix_headings: true
ocr: vlm                 # vision LLM transcribes text + describes charts
ocr_model: "openrouter:anthropic/claude-haiku-5.5"
retrieval: hybrid_rerank
scope: doc
top_k: 10
prefetch_k: 50
rrf_k: 60
reranker: onnx:gte-reranker-modernbert-base
rerank_threshold: 0.6318    # calibrated per question on dev, with VLM OCR
context_k: 10              # chosen on dev (abstention experiment)
prompt_version: answer_v2  # chosen on dev (abstention experiment)
llm: "openrouter:anthropic/claude-haiku-5.5"
llm_temperature: null    # Claude 5.5 rejects sampling parameters
judge: "openrouter:deepseek/deepseek-v4.1-flash"   # different family than the answerer
judge_temperature: 0.0
llm_concurrency: 6
dataset:
  split: test
  max_docs: null        # all test documents
