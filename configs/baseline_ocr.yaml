# One YAML = one row in the results table. See src/docrag/shared/config.py.
name: baseline_ocr
embedder: onnx:gte-small
prefix_headings: true
ocr: rapidocr            # OCR pages without a text layer (local, GPU)
retrieval: hybrid_rerank
scope: doc
top_k: 10
prefetch_k: 50
rrf_k: 60
reranker: onnx:gte-reranker-modernbert-base
rerank_threshold: 0.5772    # calibrated per question on dev, with OCR
context_k: 5
llm: null                # e.g. "ollama:qwen3:8b" or "gemini:gemini-3.8-flash"
judge: null
dataset:
  split: test
  max_docs: null        # all test documents
